    <circle cx="10" cy="22" r="2" fill="#059669" />
    <circle cx="20" cy="22" r="2" fill="#059669" />
    <circle cx="25" cy="5" r="5" fill="#ef4444" />
  </g>

  <!-- Banner -->
  <rect x="35" y="108" width="530" height="80" rx="8" fill="url(#saleGrad)" />
  <rect x="55" y="125" width="140" height="14" rx="4" fill="#6ee7b7" />
  <rect x="55" y="145" width="200" height="8" rx="3" fill="#a7f3d0" />
  <rect x="55" y="160" width="70" height="18" rx="9" fill="#10b981" />
  <!-- Sale Badge -->
  <rect x="450" y="120" width="90" height="56" rx="8" fill="#064e3b" />
  <circle cx="495" cy="140" r="14" fill="#10b981" opacity="0.3" />
  <rect x="470" y="154" width="50" height="8" rx="4" fill="#34d399" />

