  <g transform="translate(445, 200)">
    <rect x="0" y="0" width="120" height="145" rx="8" fill="#ffffff" stroke="#e2e8f0" stroke-width="1" />
    <rect x="10" y="10" width="100" height="65" rx="6" fill="#f8fafc" />
    <circle cx="60" cy="42" r="18" fill="#fae8ff" />
    <rect x="50" y="32" width="20" height="20" rx="4" fill="#9333ea" />
    <rect x="10" y="85" width="75" height="10" rx="3" fill="#1e293b" />
    <rect x="10" y="100" width="45" height="8" rx="2" fill="#059669" />
    <rect x="10" y="116" width="100" height="18" rx="4" fill="#059669" />
