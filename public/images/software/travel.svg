    <rect x="0" y="0" width="165" height="110" rx="8" fill="#ffffff" stroke="#e2e8f0" stroke-width="1" />
    <rect x="8" y="8" width="149" height="55" rx="6" fill="#e0f2fe" />
    <circle cx="82" cy="35" r="16" fill="#38bdf8" />
    <rect x="8" y="70" width="80" height="9" rx="2" fill="#1e293b" />
    <rect x="8" y="85" width="50" height="7" rx="2" fill="#0284c7" />
    <rect x="110" y="80" width="47" height="18" rx="4" fill="#0284c7" />

