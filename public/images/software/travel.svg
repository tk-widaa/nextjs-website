    <rect x="292" y="80" width="47" height="18" rx="4" fill="#d97706" />

    <!-- Dest 3 -->
    <rect x="365" y="0" width="165" height="110" rx="8" fill="#ffffff" stroke="#e2e8f0" stroke-width="1" />
    <rect x="373" y="8" width="149" height="55" rx="6" fill="#dcfce7" />
    <circle cx="447" cy="35" r="16" fill="#4ade80" />
    <rect x="373" y="70" width="80" height="9" rx="2" fill="#1e293b" />
    <rect x="373" y="85" width="50" height="7" rx="2" fill="#16a34a" />
