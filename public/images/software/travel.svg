    <path d="M 380 40 L 415 32 L 405 46 L 418 47 L 422 43 L 426 44 L 424 50 L 388 56 Z" fill="#ffffff" opacity="0.9" />
    <rect x="25" y="25" width="180" height="14" rx="4" fill="#ffffff" />
    <rect x="25" y="47" width="220" height="8" rx="3" fill="#bae6fd" />
    <rect x="25" y="68" width="100" height="22" rx="6" fill="#f59e0b" />
  </g>

  <!-- Destination Cards Grid -->
