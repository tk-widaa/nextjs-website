    <rect x="182" y="0" width="165" height="110" rx="8" fill="#ffffff" stroke="#e2e8f0" stroke-width="1" />
    <rect x="190" y="8" width="149" height="55" rx="6" fill="#fef3c7" />
    <circle cx="264" cy="35" r="16" fill="#fbbf24" />
