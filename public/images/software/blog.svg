<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 380" width="100%" height="100%">
  <defs>
    <linearGradient id="newsGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#334155" />
      <stop offset="100%" stop-color="#475569" />
    </linearGradient>
  </defs>

  <rect width="600" height="380" rx="16" fill="#f1f5f9" />

  <!-- Browser Frame -->
  <rect x="20" y="20" width="560" height="340" rx="12" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5" />
  <path d="M 20 32 A 12 12 0 0 1 32 20 L 568 20 A 12 12 0 0 1 580 32 L 580 56 L 20 56 Z" fill="#f8fafc" />
  <circle cx="42" cy="38" r="5" fill="#ef4444" />
  <circle cx="58" cy="38" r="5" fill="#f59e0b" />
  <circle cx="74" cy="38" r="5" fill="#10b981" />
  <rect x="120" y="29" width="360" height="18" rx="9" fill="#e2e8f0" />
  <rect x="135" y="34" width="130" height="8" rx="4" fill="#94a3b8" />

  <!-- Nav -->
  <rect x="20" y="56" width="560" height="42" fill="#ffffff" stroke="#f1f5f9" stroke-width="1" />
  <rect x="40" y="68" width="80" height="18" rx="4" fill="#0f172a" />
  <rect x="330" y="73" width="35" height="8" rx="4" fill="#64748b" />
  <rect x="380" y="73" width="35" height="8" rx="4" fill="#64748b" />
  <rect x="430" y="73" width="35" height="8" rx="4" fill="#64748b" />
  <rect x="485" y="68" width="75" height="18" rx="9" fill="#dc2626" />

  <!-- News Ticker -->
  <g transform="translate(35, 105)">
    <rect x="0" y="0" width="530" height="26" rx="4" fill="#fee2e2" />
    <rect x="10" y="5" width="60" height="16" rx="3" fill="#dc2626" />
    <rect x="80" y="9" width="220" height="8" rx="2" fill="#991b1b" />
  </g>

  <!-- Featured News Grid -->
  <g transform="translate(35, 140)">
    <!-- Big Headline Article Left -->
    <rect x="0" y="0" width="320" height="200" rx="8" fill="#ffffff" stroke="#e2e8f0" stroke-width="1" />
    <rect x="10" y="10" width="300" height="95" rx="6" fill="#f1f5f9" />
    <circle cx="160" cy="57" r="22" fill="#cbd5e1" />
    <rect x="10" y="115" width="60" height="12" rx="3" fill="#dc2626" />
    <rect x="10" y="135" width="240" height="14" rx="3" fill="#0f172a" />
    <rect x="10" y="155" width="280" height="8" rx="2" fill="#64748b" />
    <rect x="10" y="168" width="200" height="8" rx="2" fill="#94a3b8" />
    <rect x="10" y="184" width="70" height="6" rx="2" fill="#cbd5e1" />

    <!-- Smaller News Articles Right -->
    <!-- Article 1 -->
    <rect x="335" y="0" width="195" height="92" rx="8" fill="#ffffff" stroke="#e2e8f0" stroke-width="1" />
    <rect x="345" y="10" width="50" height="40" rx="4" fill="#e2e8f0" />
    <rect x="405" y="12" width="115" height="10" rx="2" fill="#0f172a" />
    <rect x="405" y="27" width="90" height="7" rx="2" fill="#64748b" />
    <rect x="405" y="40" width="45" height="6" rx="2" fill="#dc2626" />

    <!-- Article 2 -->
    <rect x="335" y="108" width="195" height="92" rx="8" fill="#ffffff" stroke="#e2e8f0" stroke-width="1" />
    <rect x="345" y="118" width="50" height="40" rx="4" fill="#e2e8f0" />
    <rect x="405" y="120" width="115" height="10" rx="2" fill="#0f172a" />
    <rect x="405" y="135" width="90" height="7" rx="2" fill="#64748b" />
    <rect x="405" y="148" width="45" height="6" rx="2" fill="#dc2626" />
  </g>
