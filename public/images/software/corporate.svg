<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 380" width="100%" height="100%">
  <defs>
    <linearGradient id="corpBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="corpGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2563eb" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#f8fafc" />
    </linearGradient>
  </defs>

  <!-- Background Canvas -->
  <rect width="600" height="380" rx="16" fill="#f1f5f9" />

  <!-- Browser Window Mockup -->
  <rect x="20" y="20" width="560" height="340" rx="12" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5" filter="drop-shadow(0 10px 25px rgba(0,0,0,0.06))" />

  <!-- Window Header Bar -->
  <path d="M 20 32 A 12 12 0 0 1 32 20 L 568 20 A 12 12 0 0 1 580 32 L 580 56 L 20 56 Z" fill="#f8fafc" />
  <circle cx="42" cy="38" r="5" fill="#ef4444" />
  <circle cx="58" cy="38" r="5" fill="#f59e0b" />
  <circle cx="74" cy="38" r="5" fill="#10b981" />
  <rect x="120" y="29" width="360" height="18" rx="9" fill="#e2e8f0" />
  <rect x="135" y="34" width="140" height="8" rx="4" fill="#94a3b8" />

  <!-- Website Navbar -->
  <rect x="20" y="56" width="560" height="42" fill="#ffffff" stroke="#f1f5f9" stroke-width="1" />
  <rect x="40" y="68" width="80" height="18" rx="4" fill="url(#corpGrad)" />
  <circle cx="470" cy="77" r="12" fill="#eff6ff" />
  <rect x="330" y="73" width="40" height="8" rx="4" fill="#64748b" />
  <rect x="385" y="73" width="40" height="8" rx="4" fill="#64748b" />
  <rect x="500" y="68" width="60" height="18" rx="9" fill="#1d4ed8" />

  <!-- Hero Section -->
  <rect x="35" y="110" width="530" height="115" rx="10" fill="url(#corpBg)" />
  <!-- Hero Content Left -->
  <rect x="55" y="130" width="160" height="14" rx="4" fill="#60a5fa" />
  <rect x="55" y="152" width="220" height="10" rx="3" fill="#cbd5e1" />
  <rect x="55" y="168" width="180" height="8" rx="3" fill="#94a3b8" />
  <rect x="55" y="188" width="80" height="22" rx="6" fill="#2563eb" />
  <rect x="145" y="188" width="75" height="22" rx="6" fill="transparent" stroke="#60a5fa" stroke-width="1.5" />

  <!-- Hero Graphic Right (Corporate Building / Tech Grid) -->
  <g transform="translate(420, 125)">
    <rect x="0" y="20" width="40" height="70" rx="4" fill="#334155" />
    <rect x="45" y="5" width="45" height="85" rx="4" fill="#1e3a8a" opacity="0.8" />
    <rect x="95" y="35" width="35" height="55" rx="4" fill="#475569" />
    <!-- Mini Windows -->
    <rect x="8" y="28" width="8" height="6" fill="#93c5fd" opacity="0.8" />
    <rect x="24" y="28" width="8" height="6" fill="#93c5fd" opacity="0.8" />
    <rect x="8" y="40" width="8" height="6" fill="#93c5fd" opacity="0.8" />
    <rect x="24" y="40" width="8" height="6" fill="#93c5fd" opacity="0.8" />
    <rect x="53" y="15" width="10" height="8" fill="#60a5fa" />
    <rect x="71" y="15" width="10" height="8" fill="#60a5fa" />
    <rect x="53" y="30" width="10" height="8" fill="#60a5fa" />
    <rect x="71" y="30" width="10" height="8" fill="#60a5fa" />
    <rect x="53" y="45" width="10" height="8" fill="#60a5fa" />
    <rect x="71" y="45" width="10" height="8" fill="#60a5fa" />
  </g>

  <!-- Metric Badges Row -->
  <g transform="translate(35, 238)">
    <!-- Card 1 -->
    <rect x="0" y="0" width="120" height="105" rx="8" fill="url(#cardGrad)" stroke="#e2e8f0" stroke-width="1" />
    <circle cx="25" cy="25" r="14" fill="#eff6ff" />
    <path d="M 20 25 L 24 29 L 31 21" stroke="#2563eb" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round" />
    <rect x="15" y="50" width="55" height="12" rx="3" fill="#1e293b" />
    <rect x="15" y="68" width="90" height="6" rx="2" fill="#94a3b8" />
    <rect x="15" y="78" width="75" height="6" rx="2" fill="#cbd5e1" />

    <!-- Card 2 -->
    <rect x="135" y="0" width="120" height="105" rx="8" fill="url(#cardGrad)" stroke="#e2e8f0" stroke-width="1" />
    <circle cx="160" cy="25" r="14" fill="#eff6ff" />
    <rect x="153" y="18" width="14" height="14" rx="2" stroke="#2563eb" stroke-width="2" fill="none" />
    <rect x="150" y="50" width="55" height="12" rx="3" fill="#1e293b" />
    <rect x="150" y="68" width="90" height="6" rx="2" fill="#94a3b8" />
    <rect x="150" y="78" width="75" height="6" rx="2" fill="#cbd5e1" />

    <!-- Card 3 -->
    <rect x="270" y="0" width="120" height="105" rx="8" fill="url(#cardGrad)" stroke="#e2e8f0" stroke-width="1" />
    <circle cx="295" cy="25" r="14" fill="#eff6ff" />
    <circle cx="295" cy="25" r="7" stroke="#2563eb" stroke-width="2" fill="none" />
    <rect x="285" y="50" width="55" height="12" rx="3" fill="#1e293b" />
    <rect x="285" y="68" width="90" height="6" rx="2" fill="#94a3b8" />
    <rect x="285" y="78" width="75" height="6" rx="2" fill="#cbd5e1" />

    <!-- Card 4 / Contact CTA -->
    <rect x="405" y="0" width="125" height="105" rx="8" fill="#1d4ed8" />
    <rect x="420" y="20" width="70" height="10" rx="3" fill="#ffffff" />
    <rect x="420" y="36" width="95" height="6" rx="2" fill="#93c5fd" />
    <rect x="420" y="46" width="80" height="6" rx="2" fill="#93c5fd" />
    <rect x="420" y="68" width="95" height="22" rx="6" fill="#ffffff" />
    <rect x="440" y="76" width="55" height="6" rx="2" fill="#1d4ed8" />
  </g>
</svg>
